name: 'Conan Build and Test'
description: 'Build and test baresip package using Conan with platform-specific configuration'

inputs:
  platform:
    description: 'Platform (macos or linux)'
    required: true
  profile:
    description: 'Conan profile to use'
    required: true
  build-options:
    description: 'Conan build options'
    required: true
  version:
    description: 'Package version to build'
    required: true
  conan-user:
    description: 'Conan remote username'
    required: true
  conan-password:
    description: 'Conan remote password'
    required: true
  docker-image:
    description: 'Docker image to use (Linux only)'
    required: false
  cache-path:
    description: 'Conan cache path'
    required: true

outputs:
  build-success:
    description: 'Whether build was successful'
    value: ${{ steps.build.outputs.success }}
  test-success:
    description: 'Whether tests were successful'
    value: ${{ steps.test.outputs.success }}

runs:
  using: "composite"
  steps:
    - name: Setup Conan Environment
      shell: bash
      run: |
        if [[ "${{ inputs.platform }}" == "macos" ]]; then
          # macOS setup
          python -m pip install --upgrade pip
          pip install "conan>=2.0"
          export CONAN_HOME=${{ inputs.cache-path }}
          mkdir -p $CONAN_HOME
          echo "CONAN_HOME=$CONAN_HOME" >> $GITHUB_ENV
        else
          # Linux setup (Docker-based)
          echo "🐳 Linux build will use Docker"
        fi
        
    - name: Configure Conan
      shell: bash
      run: |
        if [[ "${{ inputs.platform }}" == "macos" ]]; then
          conan profile detect --force
          conan remote add test-conan http://13.61.152.119:9300 --index 0 --force
          conan remote list
          
          # Login
          echo "${{ inputs.conan-password }}" | conan remote login test-conan "${{ inputs.conan-user }}"
          
          # Install bbconanconfig
          conan config install-pkg bbconanconfig/0.9.6
        fi
        
    - name: Build Package
      id: build
      shell: bash
      run: |
        if [[ "${{ inputs.platform }}" == "macos" ]]; then
          # macOS build
          echo "🔨 Building baresip on macOS with profile: ${{ inputs.profile }}"
          
          # Verify profile exists
          if conan profile show -pr=${{ inputs.profile }} >/dev/null 2>&1; then
            echo "✅ Using profile: ${{ inputs.profile }}"
            PROFILE_ARG="-pr:h ${{ inputs.profile }} -pr:b ${{ inputs.profile }}"
          else
            echo "❌ Profile ${{ inputs.profile }} not found"
            exit 1
          fi
          
          # Build with conan create
          conan create . \
            --version="${{ inputs.version }}" \
            $PROFILE_ARG \
            ${{ inputs.build-options }} \
            --build=missing 2>&1 | tee install_output.log
            
        else
          # Linux build (Docker)
          echo "🔨 Building baresip on Linux with Docker"
          
          # Create cache directory
          mkdir -p ${{ inputs.cache-path }}
          
          # Build in Docker
          docker run --rm --platform linux/amd64 \
            -v "$(pwd)":/workspace \
            -v "${{ inputs.cache-path }}:/tmp/conan-home" \
            -w /workspace \
            -e CONAN_NON_INTERACTIVE=1 \
            -e CONAN_HOME=/tmp/conan-home \
            ${{ inputs.docker-image }} \
            bash -c "
              conan profile detect --force
              conan remote add test-conan http://13.61.152.119:9300 --index 0 --force
              echo '${{ inputs.conan-password }}' | conan remote login test-conan '${{ inputs.conan-user }}'
              conan config install-pkg bbconanconfig/0.9.6
              
              conan create . \
                --version='${{ inputs.version }}' \
                -pr:h ${{ inputs.profile }} \
                -pr:b ${{ inputs.profile }} \
                ${{ inputs.build-options }} \
                --build=missing 2>&1 | tee install_output.log
            "
        fi
        
        # Extract built packages for upload
        sync && sleep 2
        grep -E 'Package .* created' install_output.log | sed \"s/^\\([^:]*\\):.*Package .* created.*/\\1/\" | sort | uniq > built_packages.txt || echo 'No packages were built' > built_packages.txt
        echo "success=true" >> $GITHUB_OUTPUT
        
    - name: Upload Packages
      shell: bash
      run: |
        echo "📤 Uploading built packages to test-conan remote..."
        
        # Use explicit version for baresip
        BARESIP_VERSION="${{ inputs.version }}"
        echo "📦 Using baresip version: ${BARESIP_VERSION}"
        
        if [[ "${{ inputs.platform }}" == "macos" ]]; then
          # Direct upload for macOS
          if conan list "baresip/${BARESIP_VERSION}" --cache >/dev/null 2>&1; then
            echo "✅ baresip package found in cache"
            conan upload "baresip/${BARESIP_VERSION}" -r=test-conan --confirm --metadata="*"
          else
            echo "❌ baresip package not found in cache"
            exit 1
          fi
        else
          # Docker-based upload for Linux
          docker run --rm --platform linux/amd64 \
            -v "$(pwd)":/workspace \
            -v "${{ inputs.cache-path }}:/tmp/conan-home" \
            -w /workspace \
            -e CONAN_NON_INTERACTIVE=1 \
            -e CONAN_HOME=/tmp/conan-home \
            ${{ inputs.docker-image }} \
            bash -c "
              conan profile detect --force
              conan remote add test-conan http://13.61.152.119:9300 --index 0 --force
              echo '${{ inputs.conan-password }}' | conan remote login test-conan '${{ inputs.conan-user }}'
              
              if conan list 'baresip/${BARESIP_VERSION}' --cache >/dev/null 2>&1; then
                echo '✅ baresip package found in cache'
                conan upload 'baresip/${BARESIP_VERSION}' -r=test-conan --confirm --metadata='*'
              else
                echo '❌ baresip package not found in cache'
                exit 1
              fi
            "
        fi
        
        echo "✅ Package upload completed"
        
    - name: Test Package
      id: test
      shell: bash
      run: |
        echo "🧪 Testing baresip package..."
        
        BARESIP_VERSION="${{ inputs.version }}"
        
        if [[ "${{ inputs.platform }}" == "macos" ]]; then
          # macOS testing
          mkdir -p baresip_test_deploy
          
          # Deploy package
          conan install --requires="baresip/${BARESIP_VERSION}" \
            --profile:host="${{ inputs.profile }}" \
            --profile:build="${{ inputs.profile }}" \
            ${{ inputs.build-options }} \
            -d full_deploy --deployer-folder=baresip_test_deploy
          
          # Download test metadata
          REMOTE_PACKAGE_ID=$(conan list "baresip/${BARESIP_VERSION}:*" -r=test-conan --format=compact | tr -d '\n' | grep -o ":[a-f0-9]\{40\}" | sed 's/://' | head -1)
          conan download "baresip/${BARESIP_VERSION}:${REMOTE_PACKAGE_ID}" --metadata="tests/*" -r=test-conan
          
          # Get test binary
          PACKAGE_ID=$(conan list "baresip/${BARESIP_VERSION}:*" --cache --format=compact | tr -d '\n' | grep -o ":[a-f0-9]\{40\}" | sed 's/://')
          METADATA_PATH=$(conan cache path "baresip/${BARESIP_VERSION}:${PACKAGE_ID}" --folder=metadata)
          TEST_BINARY="${METADATA_PATH}/tests/selftest"
          
          if [[ ! -f "$TEST_BINARY" ]]; then
            echo "❌ Test binary not found"
            exit 1
          fi
          
          chmod +x "$TEST_BINARY"
          
          # Setup library paths and copy modules
          BARESIP_DYLIB=$(find baresip_test_deploy -name "libbaresip.*.dylib" -type f | head -1)
          if [[ -n "$BARESIP_DYLIB" ]]; then
            BARESIP_LIB_DIR=$(dirname "$BARESIP_DYLIB")
            export DYLD_LIBRARY_PATH="${BARESIP_LIB_DIR}:$DYLD_LIBRARY_PATH"
          fi
          
          # Copy modules to current directory
          find baresip_test_deploy -name "*.so" -type f -exec cp {} . \;
          
          # Run tests
          if "$TEST_BINARY" 2>&1 | tee test_output.log; then
            echo "✅ Tests completed"
          else
            echo "❌ Tests failed"
            exit 1
          fi
          
        else
          # Linux testing (Docker)
          docker run --rm --platform linux/amd64 \
            -v "$(pwd)":/workspace \
            -v "${{ inputs.cache-path }}:/tmp/conan-home" \
            -w /workspace \
            -e CONAN_NON_INTERACTIVE=1 \
            -e CONAN_HOME=/tmp/conan-home \
            ${{ inputs.docker-image }} \
            bash -c "
              conan profile detect --force
              conan remote add test-conan http://13.61.152.119:9300 --index 0 --force
              echo '${{ inputs.conan-password }}' | conan remote login test-conan '${{ inputs.conan-user }}'
              
              # Deploy and test (same logic as macOS but in Docker)
              mkdir -p baresip_test_deploy
              
              conan install --requires='baresip/${BARESIP_VERSION}' \
                -pr:h ${{ inputs.profile }} \
                -pr:b ${{ inputs.profile }} \
                ${{ inputs.build-options }} \
                -d full_deploy --deployer-folder=baresip_test_deploy
              
              # Download test metadata  
              REMOTE_PACKAGE_ID=\$(conan list 'baresip/${BARESIP_VERSION}:*' -r=test-conan --format=compact | tr -d '\n' | grep -o ':[a-f0-9]\{40\}' | sed 's/://' | head -1)
              conan download \"baresip/${BARESIP_VERSION}:\${REMOTE_PACKAGE_ID}\" --metadata='tests/*' -r=test-conan
              
              # Get and run test binary
              PACKAGE_ID=\$(conan list 'baresip/${BARESIP_VERSION}:*' --cache --format=compact | tr -d '\n' | grep -o ':[a-f0-9]\{40\}' | sed 's/://')
              METADATA_PATH=\$(conan cache path \"baresip/${BARESIP_VERSION}:\${PACKAGE_ID}\" --folder=metadata)
              TEST_BINARY=\"\${METADATA_PATH}/tests/selftest\"
              
              if [[ ! -f \"\$TEST_BINARY\" ]]; then
                echo '❌ Test binary not found'
                exit 1
              fi
              
              chmod +x \"\$TEST_BINARY\"
              
              # Setup library paths for Linux
              BARESIP_LIB=$(find baresip_test_deploy -name 'libbaresip.so*' -type f | head -1)
              if [[ -n \"\$BARESIP_LIB\" ]]; then
                BARESIP_LIB_DIR=\$(dirname \"\$BARESIP_LIB\")
                export LD_LIBRARY_PATH=\"\${BARESIP_LIB_DIR}:\$LD_LIBRARY_PATH\"
              fi
              
              # Copy modules
              find baresip_test_deploy -name '*.so' -type f -exec cp {} . \;
              
              # Run tests
              \"\$TEST_BINARY\" 2>&1 | tee test_output.log
            "
        fi
        
        echo "success=true" >> $GITHUB_OUTPUT
