name: 'Conan Build and Test'
description: 'Build and test baresip package using Conan - unified approach'

inputs:
  platform:
    description: 'Platform (macos or linux)'
    required: true
  profile:
    description: 'Conan profile to use'
    required: true
  build-options:
    description: 'Conan build options'
    required: true
  version:
    description: 'Package version to build'
    required: true
  conan-user:
    description: 'Conan remote username'
    required: true
  conan-password:
    description: 'Conan remote password'
    required: true
  build-only:
    description: 'Only build, do not test (true/false)'
    required: false
    default: 'false'
  test-only:
    description: 'Only test, do not build (true/false)'
    required: false
    default: 'false'

outputs:
  build-success:
    description: 'Whether build was successful'
    value: ${{ steps.summary.outputs.build-success }}
  test-success:
    description: 'Whether tests were successful'
    value: ${{ steps.summary.outputs.test-success }}

runs:
  using: "composite"
  steps:
    - name: Setup Unified Conan Cache
      shell: bash
      run: |
        # Use same cache directory for both platforms
        export CONAN_HOME=/tmp/conan-home
        mkdir -p $CONAN_HOME
        echo "CONAN_HOME=$CONAN_HOME" >> $GITHUB_ENV
        echo "📁 Using unified cache: $CONAN_HOME"

    - name: Setup Python (macOS only)
      if: inputs.platform == 'macos'
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Conan (macOS only)
      if: inputs.platform == 'macos'
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install "conan>=2.0"

    - name: Configure Conan (macOS)
      if: inputs.platform == 'macos' && inputs.test-only != 'true'
      shell: bash
      run: |
        # Create platform-specific default profile to avoid conflicts
        echo "🔧 Setting up Conan with macOS-specific default profile"
        conan profile detect --force
        
        conan remote add test-conan http://13.61.152.119:9300 --index 0 --force || true
        conan remote login test-conan ${{ inputs.conan-user }} -p ${{ inputs.conan-password }}
        conan config install-pkg bbconanconfig/0.9.6

    - name: Build Package (macOS)
      if: inputs.platform == 'macos' && inputs.test-only != 'true'
      shell: bash
      run: |
        echo "🔨 Building baresip on macOS with profile: ${{ inputs.profile }}"
        echo "📦 Version: ${{ inputs.version }}"
        
        # Verify profile exists and can be read by Conan
        echo "🔍 Verifying profile: ${{ inputs.profile }}"
        if [[ -f "$CONAN_HOME/profiles/${{ inputs.profile }}" ]]; then
          echo "✅ Profile file exists: ${{ inputs.profile }}"
        else
          echo "❌ Profile file not found: ${{ inputs.profile }}"
          echo "📋 Available profiles:"
          ls -la "$CONAN_HOME/profiles/" | head -10
          exit 1
        fi
        
        # Test conan profile show (should work now with default profile)
        if conan profile show -pr=${{ inputs.profile }} >/dev/null 2>&1; then
          echo "✅ Conan can read profile: ${{ inputs.profile }}"
        else
          echo "❌ Conan profile show failed for: ${{ inputs.profile }}"
          exit 1
        fi
        
        # Build with conan create
        conan create . \
          --version="${{ inputs.version }}" \
          -pr:h ${{ inputs.profile }} \
          -pr:b ${{ inputs.profile }} \
          ${{ inputs.build-options }} \
          --build=missing 2>&1 | tee build_output.log

    - name: Build Docker Image (Linux only)
      if: inputs.platform == 'linux'
      shell: bash
      run: |
        echo "🐳 Building Docker image for Linux..."
        docker build -f docker/linux-conan.Dockerfile -t baresip-linux-conan:latest .

    - name: Build Package (Linux)
      if: inputs.platform == 'linux' && inputs.test-only != 'true'
      shell: bash
      run: |
        echo "🔨 Building baresip on Linux with Docker"
        echo "📦 Version: ${{ inputs.version }}"
        
        # Run build in Docker with shared cache
        docker run --rm --platform linux/amd64 \
          -v "$(pwd)":/workspace \
          -v "/tmp/conan-home:/tmp/conan-home" \
          -w /workspace \
          -e CONAN_NON_INTERACTIVE=1 \
          -e CONAN_HOME=/tmp/conan-home \
          baresip-linux-conan:latest \
          bash -c "
            # Create platform-specific default profile to avoid conflicts
            echo '🔧 Setting up Conan with Linux-specific default profile'
            conan profile detect --force
            
            conan remote add test-conan http://13.61.152.119:9300 --index 0 --force || true
            conan remote login test-conan ${{ inputs.conan-user }} -p ${{ inputs.conan-password }}
            conan config install-pkg bbconanconfig/0.9.6
            
            echo 'Building with version: ${{ inputs.version }}'
            conan create . \
              --version='${{ inputs.version }}' \
              -pr:h ${{ inputs.profile }} \
              -pr:b ${{ inputs.profile }} \
              ${{ inputs.build-options }} \
              --build=missing 2>&1 | tee build_output.log
          "

    - name: Upload All Packages (Unified)
      shell: bash
      if: always() && inputs.test-only != 'true'
      run: |
        echo "📤 Uploading all packages from unified cache..."
        
        # Find all locally built packages (both from this build and dependencies)
        echo "🔍 Scanning cache for packages to upload..."
        
        # Get baresip package if it exists
        BARESIP_VERSION="${{ inputs.version }}"
        if conan list "baresip/$BARESIP_VERSION" --cache >/dev/null 2>&1; then
          echo "✅ Found baresip package: $BARESIP_VERSION"
          echo "📦 Uploading baresip with metadata..."
          conan upload "baresip/$BARESIP_VERSION" -r=test-conan --confirm --metadata="*" || echo "⚠️ Failed to upload baresip"
        else
          echo "⚠️ baresip package not found in cache"
        fi
        
        # Upload any other packages that were built locally
        echo "🔍 Looking for other built packages..."
        if [ -f build_output.log ]; then
          # Extract package names from build log
          grep -E "Package '[^']+' created" build_output.log | sed "s/^\\([^:]*\\):.*Package '.*' created.*/\\1/" | sort | uniq > built_packages.txt || true
          
          if [ -s built_packages.txt ]; then
            echo "📋 Found built packages:"
            cat built_packages.txt
            
            while read package_ref; do
              if [[ -n "$package_ref" && "$package_ref" != "baresip/"* ]]; then
                echo "📦 Uploading: $package_ref"
                conan upload "$package_ref" -r=test-conan --confirm || echo "⚠️ Failed to upload $package_ref"
              fi
            done < built_packages.txt
          else
            echo "ℹ️ No additional packages to upload"
          fi
        fi

    - name: Configure Conan for Test-Only (macOS)
      if: inputs.platform == 'macos' && inputs.test-only == 'true'
      shell: bash
      run: |
        echo "🔧 Setting up Conan for testing only (macOS)"
        # Create default profile for test-only mode too
        conan profile detect --force
        
        conan remote add test-conan http://13.61.152.119:9300 --index 0 --force || true
        conan remote login test-conan ${{ inputs.conan-user }} -p ${{ inputs.conan-password }}

    - name: Test Package
      shell: bash
      if: always() && inputs.build-only != 'true'
      run: |
        echo "🧪 Testing baresip package..."
        
        BARESIP_VERSION="${{ inputs.version }}"
        
        # Check if package exists locally, if not try to download it
        if ! conan list "baresip/$BARESIP_VERSION" --cache >/dev/null 2>&1; then
          echo "📥 baresip package not found in local cache, checking remote..."
          
          # Check if it exists on remote
          if conan list "baresip/$BARESIP_VERSION" -r=test-conan 2>&1 | grep -q "ERROR.*not found"; then
            echo "❌ Package not found on remote - build may have failed or upload incomplete"
            exit 1
          else
            echo "✅ Package found on remote, downloading for testing..."
            # Download will happen during conan install step
          fi
        fi
        
        # Deploy for testing
        mkdir -p baresip_test_deploy
        
        if [[ "${{ inputs.platform }}" == "macos" ]]; then
          # macOS testing
          conan install --requires="baresip/$BARESIP_VERSION" \
            -pr:h ${{ inputs.profile }} \
            -pr:b ${{ inputs.profile }} \
            ${{ inputs.build-options }} \
            -d full_deploy --deployer-folder=baresip_test_deploy
          
          # Get test binary from metadata
          PACKAGE_ID=$(conan list "baresip/$BARESIP_VERSION:*" --cache --format=compact | tr -d '\n' | grep -o ":[a-f0-9]\{40\}" | sed 's/://' | head -1)
          METADATA_PATH=$(conan cache path "baresip/$BARESIP_VERSION:$PACKAGE_ID" --folder=metadata)
          TEST_BINARY="$METADATA_PATH/tests/selftest"
          
          if [[ -f "$TEST_BINARY" ]]; then
            chmod +x "$TEST_BINARY"
            
            # Setup library paths
            BARESIP_DYLIB=$(find baresip_test_deploy -name "libbaresip.*.dylib" -type f | head -1)
            if [[ -n "$BARESIP_DYLIB" ]]; then
              export DYLD_LIBRARY_PATH="$(dirname "$BARESIP_DYLIB"):$DYLD_LIBRARY_PATH"
            fi
            
            # Copy modules to current directory
            find baresip_test_deploy -name "*.so" -type f -exec cp {} . \;
            
            # Run tests
            echo "🏃 Running tests..."
            "$TEST_BINARY" 2>&1 | tee test_output.log || echo "⚠️ Some tests failed"
          else
            echo "⚠️ Test binary not found - skipping tests"
          fi
          
        else
          # Linux testing in Docker
          docker run --rm --platform linux/amd64 \
            -v "$(pwd)":/workspace \
            -v "/tmp/conan-home:/tmp/conan-home" \
            -w /workspace \
            -e CONAN_HOME=/tmp/conan-home \
            baresip-linux-conan:latest \
            bash -c "
              # Setup remotes for testing (no profile detection needed)
              conan remote add test-conan http://13.61.152.119:9300 --index 0 --force || true
              
              conan install --requires='baresip/$BARESIP_VERSION' \
                -pr:h ${{ inputs.profile }} \
                -pr:b ${{ inputs.profile }} \
                ${{ inputs.build-options }} \
                -d full_deploy --deployer-folder=baresip_test_deploy
              
              # Get test binary from metadata
              PACKAGE_ID=\$(conan list 'baresip/$BARESIP_VERSION:*' --cache --format=compact | tr -d '\n' | grep -o ':[a-f0-9]\{40\}' | sed 's/://' | head -1)
              METADATA_PATH=\$(conan cache path \"baresip/$BARESIP_VERSION:\$PACKAGE_ID\" --folder=metadata)
              TEST_BINARY=\"\$METADATA_PATH/tests/selftest\"
              
              if [[ -f \"\$TEST_BINARY\" ]]; then
                chmod +x \"\$TEST_BINARY\"
                
                # Setup library paths for Linux
                BARESIP_LIB=\$(find baresip_test_deploy -name 'libbaresip.so*' -type f | head -1)
                if [[ -n \"\$BARESIP_LIB\" ]]; then
                  export LD_LIBRARY_PATH=\"\$(dirname \"\$BARESIP_LIB\"):\$LD_LIBRARY_PATH\"
                fi
                
                # Copy modules
                find baresip_test_deploy -name '*.so' -type f -exec cp {} . \;
                
                # Run tests
                echo '🏃 Running tests...'
                \"\$TEST_BINARY\" 2>&1 | tee test_output.log || echo '⚠️ Some tests failed'
              else
                echo '⚠️ Test binary not found - skipping tests'
              fi
            " || echo "⚠️ Linux tests failed"
        fi

    - name: Summary
      id: summary
      shell: bash
      if: always()
      run: |
        echo "📊 Build and Test Summary"
        
        # Check if build succeeded
        if conan list "baresip/${{ inputs.version }}" --cache >/dev/null 2>&1; then
          echo "build-success=true" >> $GITHUB_OUTPUT
          echo "✅ Build: SUCCESS"
        else
          echo "build-success=false" >> $GITHUB_OUTPUT
          echo "❌ Build: FAILED"
        fi
        
        # Check if tests ran
        if [ -f test_output.log ]; then
          echo "test-success=true" >> $GITHUB_OUTPUT
          echo "✅ Tests: COMPLETED"
        else
          echo "test-success=false" >> $GITHUB_OUTPUT
          echo "⚠️ Tests: SKIPPED"
        fi