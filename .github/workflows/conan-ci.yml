name: Baresip Conan CI

on:
  push:
    branches: ["main", "conan-integration"]
  pull_request:
    branches: ["main", "conan-integration"]

env:
  CONAN_V2_MODE: 1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: "linux-x64"
            os: ubuntu-latest
            arch: x86_64
            build_type: Release
          - profile: "macos-arm64"
            os: macos-latest
            arch: armv8
            build_type: Release
          - profile: "macos-x64"
            os: macos-latest
            arch: x86_64
            build_type: Release
          - profile: "windows-x64"
            os: windows-latest
            arch: x86_64
            build_type: Release

    runs-on: ${{ matrix.os }}
    name: "${{ matrix.profile }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Conan
        run: |
          python -m pip install --upgrade pip
          pip install "conan>=2.0.0"

      - name: Configure Conan (Unix)
        if: runner.os != 'Windows'
        run: |
          echo "=== Conan Profile Configuration Debug ==="
          echo "Matrix profile: ${{ matrix.profile }}"
          echo "Matrix OS: ${{ matrix.os }}"
          echo "Matrix arch: ${{ matrix.arch }}"
          echo "Runner OS: ${{ runner.os }}"
          echo "RUNNER_OS env: $RUNNER_OS"
          
          conan profile detect --force
          mkdir -p ~/.conan2/profiles

          if [[ "${{ matrix.profile }}" == "macos-"* ]]; then
            echo "✅ Creating macOS profile for ${{ matrix.profile }}"
            cat > ~/.conan2/profiles/ci << 'EOF'
          [settings]
          os=Macos
          arch=${{ matrix.arch }}
          compiler=apple-clang
          compiler.version=15
          compiler.libcxx=libc++
          build_type=${{ matrix.build_type }}
          [buildenv]
          CC=clang
          CXX=clang++
          EOF
          elif [[ "${{ matrix.profile }}" == "linux-"* ]]; then
            echo "✅ Creating Linux profile for ${{ matrix.profile }}"
            cat > ~/.conan2/profiles/ci << 'EOF'
          [settings]
          os=Linux
          arch=${{ matrix.arch }}
          compiler=gcc
          compiler.version=11
          compiler.libcxx=libstdc++11
          build_type=${{ matrix.build_type }}
          EOF
          else
            echo "❌ Unknown profile: ${{ matrix.profile }}"
            echo "Available profiles should match: macos-* or linux-*"
            exit 1
          fi
          
          echo "=== Generated profile contents ==="
          cat ~/.conan2/profiles/ci
          echo "=== End profile debug ==="

      - name: Configure Conan (Windows)
        if: runner.os == 'Windows'
        run: |
          conan profile detect --force
          New-Item -ItemType Directory -Force -Path ~/.conan2/profiles
          echo "[settings]" > ~/.conan2/profiles/ci
          echo "os=Windows" >> ~/.conan2/profiles/ci
          echo "arch=${{ matrix.arch }}" >> ~/.conan2/profiles/ci
          echo "compiler=msvc" >> ~/.conan2/profiles/ci
          echo "compiler.version=193" >> ~/.conan2/profiles/ci
          echo "compiler.runtime=dynamic" >> ~/.conan2/profiles/ci
          echo "build_type=${{ matrix.build_type }}" >> ~/.conan2/profiles/ci

      - name: Install system dependencies (Linux)
        if: startsWith(matrix.profile, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libc++-dev libc++abi-dev \
            libasound2-dev libjack-dev \
            libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libegl1-mesa-dev \
            portaudio19-dev

      - name: Install system dependencies (macOS)
        if: startsWith(matrix.profile, 'macos-')
        run: |
          brew install pkg-config portaudio

      - name: Setup Conan remotes
        run: |
          # Add artifactory first so it has higher priority
          conan remote add artifactory ${{ secrets.CONAN_REMOTE_URL }} --force
          conan remote add conancenter https://center2.conan.io --force
          
          # Verify remotes are configured correctly
          echo "=== Configured remotes ==="
          conan remote list
          
          # Check if libre is available in artifactory (Conan 2.x command)
          echo "=== Checking for libre in artifactory ==="
          conan list "libre/*" --remote=artifactory || echo "libre not found in artifactory"
          
          # Check what packages are available in artifactory (Conan 2.x command)
          echo "=== Packages in artifactory ==="
          conan list "*" --remote=artifactory | head -20 || echo "No packages found or search failed"
          
          # Show remote priority order (artifactory should be first)
          echo "=== Remote priority order ==="
          conan remote list
          echo "✅ Artifactory is checked FIRST for existing packages"
          echo "✅ Conan Center is FALLBACK for recipes only"
          echo "✅ Built packages will be uploaded to Artifactory"

      - name: Authenticate with Artifactory
        env:
          CONAN_USER_ARTIFACTORY: ${{ secrets.CONAN_USER }}
          CONAN_PASSWORD_ARTIFACTORY: ${{ secrets.CONAN_PASSWORD }}
        run: |
          # Set environment variables for persistent authentication
          echo "CONAN_USER_ARTIFACTORY=${{ secrets.CONAN_USER }}" >> $GITHUB_ENV
          echo "CONAN_PASSWORD_ARTIFACTORY=${{ secrets.CONAN_PASSWORD }}" >> $GITHUB_ENV
          
          # Login with explicit credentials
          conan remote login artifactory ${{ secrets.CONAN_USER }} -p ${{ secrets.CONAN_PASSWORD }}
          
          # Verify authentication worked by testing a simple command
          echo "=== Testing artifactory connection after authentication ==="
          conan list "*" --remote=artifactory | head -5 || echo "Failed to list packages from artifactory"

      - name: Cache Conan packages
        uses: actions/cache@v3
        with:
          path: ~/.conan2
          key: conan-baresip-${{ matrix.profile }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-baresip-${{ matrix.profile }}-

      - name: Ensure Conan profile matches matrix (after cache restore)
        if: runner.os != 'Windows'
        run: |
          echo "=== Validating cache matches runner ==="
          uname -a || true
          python3 -c 'import platform,sys;print(platform.platform())' || true
          # If the cache contains paths from another OS (e.g. macOS paths) wipe it to avoid poisoning the job
          if grep -R "^/Users/" -n ~/.conan2 2>/dev/null | head -n1; then
            echo "⚠️  Detected macOS paths in Conan cache on Linux. Clearing cache directory to prevent contamination."
            rm -rf ~/.conan2/*
            mkdir -p ~/.conan2/profiles
          fi

          # Re-create the 'ci' profile to avoid stale profiles from cache
          mkdir -p ~/.conan2/profiles
          if [[ "${{ matrix.profile }}" == "macos-"* ]]; then
            cat > ~/.conan2/profiles/ci << 'EOF'
          [settings]
          os=Macos
          arch=${{ matrix.arch }}
          compiler=apple-clang
          compiler.version=15
          compiler.libcxx=libc++
          build_type=${{ matrix.build_type }}
          [buildenv]
          CC=clang
          CXX=clang++
          EOF
          elif [[ "${{ matrix.profile }}" == "linux-"* ]]; then
            cat > ~/.conan2/profiles/ci << 'EOF'
          [settings]
          os=Linux
          arch=${{ matrix.arch }}
          compiler=gcc
          compiler.version=11
          compiler.libcxx=libstdc++11
          build_type=${{ matrix.build_type }}
          EOF
          fi
          echo "=== Active CI profile ==="
          cat ~/.conan2/profiles/ci

      - name: Ensure Conan remotes after cache/profile (Unix)
        if: runner.os != 'Windows'
        env:
          CONAN_REMOTE_URL: ${{ secrets.CONAN_REMOTE_URL }}
          CONAN_USER: ${{ secrets.CONAN_USER }}
          CONAN_PASSWORD: ${{ secrets.CONAN_PASSWORD }}
        run: |
          # Re-add and enable artifactory remote in case cache wipe removed remotes
          conan remote add artifactory "$CONAN_REMOTE_URL" --force
          conan remote add conancenter https://center2.conan.io --force
          conan remote enable artifactory || true
          conan remote login artifactory "$CONAN_USER" -p "$CONAN_PASSWORD"
          echo "=== Remotes after ensure-step ==="
          conan remote list

      - name: Build dependencies and upload missing packages (Unix)
        if: runner.os != 'Windows'
        env:
          CONAN_USER_ARTIFACTORY: ${{ secrets.CONAN_USER }}
          CONAN_PASSWORD_ARTIFACTORY: ${{ secrets.CONAN_PASSWORD }}
        run: |
          echo "Building baresip dependencies and uploading missing packages..."
          
          # Re-authenticate to ensure fresh token before build operations
          echo "=== Re-authenticating with Artifactory before build ==="
          conan remote login artifactory ${{ secrets.CONAN_USER }} -p ${{ secrets.CONAN_PASSWORD }}
          
          # Check if libre is available, if not build it from source
          echo "=== Checking libre availability ==="
          if ! conan list "libre/4.0.0" --remote=artifactory; then
            echo "libre/4.0.0 not found in artifactory, building from source..."
            
            # Clone and build libre from the re repository
            git clone https://github.com/baresip/re.git /tmp/re
            cd /tmp/re
            git checkout v4.0.0
            
            # Create the libre package
            conan create . --name=libre --version=4.0.0 --profile:build=ci --profile:host=ci
            
            # Upload to artifactory for future use
            conan upload "libre/4.0.0" -r artifactory -c
            
            cd -
          else
            echo "✅ libre/4.0.0 found in artifactory"
          fi
          
          # Install dependencies with comprehensive multimedia options
          # This will check artifactory FIRST, then conan-center for recipes, build missing, upload to artifactory
          echo "=== Installing dependencies (artifactory first, then build missing) ==="
          conan install . --profile:build=ci --profile:host=ci --build=missing \
            -c tools.system.package_manager:mode=install \
            -o baresip/*:with_opus=True \
            -o baresip/*:with_g722=True \
            -o baresip/*:with_g711=True \
            -o baresip/*:with_av1=True \
            -o baresip/*:with_openssl=True \
            -o baresip/*:with_gstreamer=True \
            -o baresip/*:with_sdl=True \
            -o baresip/*:with_mosquitto=False \
            -o baresip/*:with_png=True \
            -o baresip/*:with_sndfile=True

          # Upload any newly built dependencies to artifactory
          echo "Uploading multimedia dependencies to Artifactory..."
          conan list "*:*" --format=compact | grep -v "baresip/" | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//' | while read pkg; do
            if [ ! -z "$pkg" ]; then
              echo "Uploading dependency: $pkg"
              conan upload "$pkg" -r artifactory -c || echo "Failed to upload $pkg, continuing..."
            fi
          done

      - name: Build dependencies and upload missing packages (Windows)
        if: runner.os == 'Windows'
        env:
          CONAN_USER_ARTIFACTORY: ${{ secrets.CONAN_USER }}
          CONAN_PASSWORD_ARTIFACTORY: ${{ secrets.CONAN_PASSWORD }}
        run: |
          echo "Building baresip dependencies and uploading missing packages..."
          
          # Re-authenticate to ensure fresh token before build operations
          echo "=== Re-authenticating with Artifactory before build ==="
          conan remote login artifactory ${{ secrets.CONAN_USER }} -p ${{ secrets.CONAN_PASSWORD }}
          
          # Check if libre is available, if not build it from source
          echo "=== Checking libre availability ==="
          $libreExists = $false
          try {
            conan list "libre/4.0.0" --remote=artifactory
            $libreExists = $true
            echo "✅ libre/4.0.0 found in artifactory"
          } catch {
            echo "libre/4.0.0 not found in artifactory, building from source..."
            
            # Clone and build libre from the re repository
            git clone https://github.com/baresip/re.git C:\temp\re
            cd C:\temp\re
            git checkout v4.0.0
            
            # Create the libre package
            conan create . --name=libre --version=4.0.0 --profile:build=ci --profile:host=ci
            
            # Upload to artifactory for future use
            conan upload "libre/4.0.0" -r artifactory -c
            
            cd -
          }
          
          # Install dependencies with Windows-compatible options
          conan install . --profile:build=ci --profile:host=ci --build=missing `
            -o baresip/*:with_opus=True `
            -o baresip/*:with_g722=True `
            -o baresip/*:with_g711=True `
            -o baresip/*:with_av1=True `
            -o baresip/*:with_openssl=True `
            -o baresip/*:with_sdl=True `
            -o baresip/*:with_mosquitto=False `
            -o baresip/*:with_png=True `
            -o baresip/*:with_sndfile=True
          
          # Upload any newly built dependencies to artifactory
          echo "Uploading multimedia dependencies to Artifactory..."
          # Enhanced parsing to filter out metadata and headers
          $rawOutput = conan list "*:*" --format=compact
          $packages = $rawOutput | Where-Object { 
            $_ -and                                    # Not null/empty
            $_.Trim() -ne "" -and                     # Not empty after trim
            $_ -notmatch "baresip/" -and              # Not baresip packages
            $_ -notmatch "^Local Cache" -and          # Not header
            $_ -notmatch "^settings:" -and            # Not settings metadata
            $_ -notmatch "^options:" -and             # Not options metadata
            $_ -match "^[a-zA-Z0-9_-]+/[0-9]" -and    # Proper package format (name/version)
            $_ -match ":"                             # Must contain colon for package ID
          } | ForEach-Object { $_.Trim() } | Where-Object { $_ -ne "" }
          
          foreach ($pkg in $packages) {
            if ($pkg -and $pkg.Length -gt 0) {
              echo "Uploading dependency: $pkg"
              conan upload "$pkg" -r artifactory -c
              if ($LASTEXITCODE -ne 0) {
                echo "Failed to upload $pkg, continuing..."
              }
            }
          }

      - name: Test default multimedia configuration
        env:
          CONAN_USER_ARTIFACTORY: ${{ secrets.CONAN_USER }}
          CONAN_PASSWORD_ARTIFACTORY: ${{ secrets.CONAN_PASSWORD }}
        run: |
          echo "Testing baresip with default multimedia configuration..."
          
          # Re-authenticate to ensure fresh token before test build
          echo "=== Re-authenticating with Artifactory before test ==="
          conan remote login artifactory ${{ secrets.CONAN_USER }} -p ${{ secrets.CONAN_PASSWORD }}
          
          conan create . --profile:build=ci --profile:host=ci --build=missing \
            -c tools.system.package_manager:mode=install

          # Upload the baresip package
          conan upload "baresip/*" -r artifactory -c
          
          # Show package information (now that it exists)
          echo "=== Baresip Package Created ==="
          conan list baresip/4.0.0:* || echo "Package not found in local cache"

      - name: Test minimal configuration
        if: matrix.profile != 'windows-x64'
        run: |
          echo "Testing baresip minimal configuration..."
          conan create . --profile:build=ci --profile:host=ci \
            -c tools.system.package_manager:mode=install \
            -o baresip/*:with_opus=False \
            -o baresip/*:with_av1=False \
            -o baresip/*:with_gstreamer=False \
            -o baresip/*:with_sdl=False \
            -o baresip/*:with_mosquitto=False \
            -o baresip/*:with_png=False \
            -o baresip/*:with_sndfile=False \
            --build=missing

          # Upload the minimal variant
          conan upload "baresip/*" -r artifactory -c

      - name: Test professional audio configuration (Linux only)
        if: matrix.profile == 'linux-x64'
        run: |
          echo "Testing baresip with professional audio configuration..."
          conan create . --profile:build=ci --profile:host=ci \
            -c tools.system.package_manager:mode=install \
            -o baresip/*:with_opus=True \
            -o baresip/*:with_g722=True \
            -o baresip/*:with_alsa=True \
            -o baresip/*:with_pulseaudio=True \
            -o baresip/*:with_pipewire=True \
            -o baresip/*:with_jack=True \
            -o baresip/*:with_portaudio=True \
            -o baresip/*:with_gtk=True \
            --build=missing

          # Upload the professional audio variant
          conan upload "baresip/*" -r artifactory -c

      - name: Test video-focused configuration
        if: matrix.profile != 'windows-x64'
        run: |
          echo "Testing baresip with video-focused configuration..."
          conan create . --profile:build=ci --profile:host=ci \
            -c tools.system.package_manager:mode=install \
            -o baresip/*:with_av1=True \
            -o baresip/*:with_sdl=True \
            -o baresip/*:with_gstreamer=True \
            -o baresip/*:with_png=True \
            --build=missing

          # Upload any new video dependencies
          conan list "*:*" --format=compact | grep -v "baresip/" | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//' | while read pkg; do
            if [ ! -z "$pkg" ]; then
              echo "Uploading video dependency: $pkg"
              conan upload "$pkg" -r artifactory -c || echo "Failed to upload $pkg, continuing..."
            fi
          done

          # Upload the video variant
          conan upload "baresip/*" -r artifactory -c

      - name: Show available dependencies
        run: |
          echo "=== Multimedia dependencies available ==="
          conan list "*:*" --format=compact | grep -v "baresip/" || echo "No dependencies found yet"

  quality:
    runs-on: ubuntu-latest
    name: "Quality Checks"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          pip install conan yamllint

      - name: Validate Conan recipe
        run: |
          conan export . --name=baresip --version=4.0.0

      - name: Check workflow syntax
        run: |
          yamllint .github/workflows/conan-*.yml

  summary:
    needs: [build, quality]
    if: always()
    runs-on: ubuntu-latest
    name: "Build Summary"

    steps:
      - name: Summary
        run: |
          echo "## 🚀 Baresip Conan CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Platform Support" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ macOS (arm64 & x86_64)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Windows (x86_64)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Linux (x86_64)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Multimedia Dependencies Uploaded" >> $GITHUB_STEP_SUMMARY
          echo "- 🎵 Audio: Opus, G.722, G.711, libsndfile" >> $GITHUB_STEP_SUMMARY
          echo "- 🎥 Video: AV1, SDL2, PNG" >> $GITHUB_STEP_SUMMARY
          echo "- 🔊 Audio Systems: ALSA, PulseAudio, PipeWire, JACK, PortAudio" >> $GITHUB_STEP_SUMMARY
          echo "- 🎬 Multimedia: GStreamer, FFmpeg" >> $GITHUB_STEP_SUMMARY
          echo "- 🔒 Security: OpenSSL" >> $GITHUB_STEP_SUMMARY
          echo "- 🌐 Networking: MQTT (Mosquitto)" >> $GITHUB_STEP_SUMMARY
          echo "- 🖥️ UI: GTK (Linux), SDL2" >> $GITHUB_STEP_SUMMARY