name: Conan Linux Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Check if this is a Conan integration (skip if not)
  check-conan:
    runs-on: ubuntu-latest
    outputs:
      skip-legacy: ${{ steps.check.outputs.skip-legacy }}
    steps:
    - uses: actions/checkout@v4
    - id: check
      run: |
        if [[ -f "conanfile.py" ]]; then
          echo "skip-legacy=false" >> $GITHUB_OUTPUT
          echo "🚀 Conan integration detected"
        else
          echo "skip-legacy=true" >> $GITHUB_OUTPUT
          echo "📦 No conanfile.py found, skipping Conan workflow"
        fi

  linux-build:
    needs: check-conan
    if: needs.check-conan.outputs.skip-legacy == 'false'
    runs-on: ubuntu-24.04
    
    strategy:
      matrix:
        profile: 
          - bb_linux_ubuntu_24_10_x86_64_release_clang_19
        config:
          - { preset: "default", opts: "-o 'baresip/*:with_sdl=True' -o 'baresip/*:with_av1=True' -o 'baresip/*:with_ffmpeg=True' -o 'baresip/*:with_vpx=True' -o 'baresip/*:with_sndfile=True' -o 'baresip/*:with_mpg123=True' -o 'baresip/*:with_gstreamer=False' -o 'baresip/*:with_gtk=False' -o 'baresip/*:with_pipewire=False' -o 'baresip/*:with_pulseaudio=False' -o 'ffmpeg/*:with_libx265=False'" }

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Cache Conan packages (Docker)
      uses: actions/cache@v4
      with:
        path: /tmp/conan-cache-linux
        key: conan-linux-${{ runner.os }}-${{ matrix.profile }}-${{ hashFiles('conanfile.py', 'conandata.yml') }}-${{ hashFiles('.github/workflows/conan-linux.yml') }}
        restore-keys: |
          conan-linux-${{ runner.os }}-${{ matrix.profile }}-${{ hashFiles('conanfile.py', 'conandata.yml') }}-
          conan-linux-${{ runner.os }}-${{ matrix.profile }}-
          conan-linux-${{ runner.os }}-

    - name: Build Docker image
      run: |
        echo "🐳 Building Docker image with all dependencies..."
        DOCKER_BUILDKIT=1 docker build --platform linux/amd64 -f docker/linux-conan.Dockerfile -t baresip-linux-conan:latest .

    - name: Build with Conan in Docker
      run: |
        echo "🔨 Building baresip with profile: ${{ matrix.profile }}"
        echo "📋 Configuration: ${{ matrix.config.preset }}"
        
        # Create cache directory on host
        mkdir -p /tmp/conan-cache-linux
        
        # Run build in Docker container with mounted cache (persistent across builds)
        docker run --rm --platform linux/amd64 \
          -v "$(pwd)":/workspace \
          -v "/tmp/conan-cache-linux:/tmp/conan-home" \
          -w /workspace \
          -e CONAN_NON_INTERACTIVE=1 \
          -e CONAN_HOME=/tmp/conan-home \
          -e GITHUB_EVENT_NAME="${{ github.event_name }}" \
          -e GITHUB_REF_NAME="${{ github.ref_name }}" \
          -e GITHUB_REF="${{ github.ref }}" \
          baresip-linux-conan:latest \
          bash -c "
            echo '🔧 Setting up with correct clang-18 profile...'
            conan profile detect --force
            conan remote add test-conan http://13.61.152.119:9300 --index 0 --force
            echo 'secure123' | conan remote login test-conan builder
            conan config install-pkg bbconanconfig/0.9.6
            
            echo '🏗️ Building minimal baresip with all missing dependencies...'
            echo '📺 Using exact same configuration as successful local build!'
            conan create . \
              ${{ matrix.config.opts }} \
              --build=missing 2>&1 | tee install_output.log
            
            echo '🔍 Extracting built packages from install log...'
            # Wait for output to be fully written
            sync && sleep 2
            echo '🔍 Debug: Searching for package creation patterns...'
            grep -E '(Package .* created|Created package)' install_output.log || echo 'No packages created'
            # Extract package references (name/version) from creation messages
            # Lines look like: 'ffmpeg/7.1.1: Package abc123... created'
            grep -E 'Package .* created' install_output.log | sed \"s/^\\([^:]*\\):.*Package .* created.*/\\1/\" | sort | uniq > /workspace/built_packages.txt || echo 'No packages were built' > /workspace/built_packages.txt
            echo '📋 Built packages:'
            cat /workspace/built_packages.txt
          "
          
    - name: Upload packages to artifactory
      if: always()
      run: |
        echo "📤 Uploading built packages to test-conan remote..."
        
        # Run upload in Docker container with mounted cache (same as build step)
        docker run --rm --platform linux/amd64 \
          -v "$(pwd)":/workspace \
          -v "/tmp/conan-cache-linux:/tmp/conan-home" \
          -w /workspace \
          -e CONAN_NON_INTERACTIVE=1 \
          -e CONAN_HOME=/tmp/conan-home \
          baresip-linux-conan:latest \
          bash -c "
            echo '🔧 Setting up...'
            conan profile detect --force
            conan remote add test-conan http://13.61.152.119:9300 --index 0 --force
            echo 'secure123' | conan remote login test-conan builder
            
            # Read the built packages list
            if [[ -f built_packages.txt ]]; then
              echo '📋 Packages detected as built:'
              cat built_packages.txt
              
              if [[ -s built_packages.txt ]]; then
                echo '📤 Uploading detected packages...'
                while IFS= read -r package; do
                  if [[ -n \"\$package\" && \"\$package\" != 'No packages were built' ]]; then
                    echo \"📦 Uploading: \$package\"
                    conan upload \"\$package\" -r=test-conan --confirm || echo \"⚠️ \$package upload failed or already exists\"
                  fi
                done < built_packages.txt
              else
                echo '⚠️ No packages were built to upload'
              fi
            else
              echo '⚠️ built_packages.txt not found, uploading all packages as fallback'
              conan upload '*' -r=test-conan --confirm || echo '⚠️ Some packages may already exist'
            fi
            
            echo '✅ Upload completed!'
          "
        
    - name: ✅ Build completed successfully  
      run: |
        echo "✅ Build and upload completed successfully!"
        echo "🎯 Used exact same configuration as successful local Docker build"
        echo "📦 Built minimal baresip with audio support (alsa + opus)"
