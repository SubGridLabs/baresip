name: Conan Linux Build

on:
  push:
    branches: [ main, conan-integration ]
  pull_request:
    branches: [ main ]

jobs:
  # Check if this is a Conan integration (skip if not)
  check-conan:
    runs-on: ubuntu-latest
    outputs:
      skip-legacy: ${{ steps.check.outputs.skip-legacy }}
    steps:
    - uses: actions/checkout@v4
    - id: check
      run: |
        if [[ -f "conanfile.py" ]]; then
          echo "skip-legacy=false" >> $GITHUB_OUTPUT
          echo "🚀 Conan integration detected"
        else
          echo "skip-legacy=true" >> $GITHUB_OUTPUT
          echo "📦 No conanfile.py found, skipping Conan workflow"
        fi

  linux-build:
    needs: check-conan
    if: needs.check-conan.outputs.skip-legacy == 'false'
    runs-on: ubuntu-24.04
    
    strategy:
      matrix:
        profile: 
          - bb_linux_ubuntu_24_10_x86_64_release_clang_19
        config:
          - { preset: "default", opts: "-o 'baresip/*:with_sdl=False' -o 'baresip/*:with_gstreamer=False' -o 'baresip/*:with_gtk=False' -o 'baresip/*:with_pipewire=True' -o 'baresip/*:with_sndfile=False' -o 'baresip/*:with_av1=True' -o 'baresip/*:with_ffmpeg=True' -o 'baresip/*:with_vpx=True' -o 'baresip/*:with_pulseaudio=False' -o 'baresip/*:with_mpg123=False'" }

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        echo "🐳 Building Docker image with all dependencies..."
        DOCKER_BUILDKIT=1 docker build --platform linux/amd64 -f docker/linux-conan.Dockerfile -t baresip-linux-conan:latest .

    - name: Configure Conan in Docker
      run: |
        echo "🏗️ Configuring Conan in Docker container with internal cache..."
        
        # Configure Conan remotes and authentication in Docker (internal cache only)
        docker run --rm --platform linux/amd64 \
          -v "$(pwd)":/workspace \
          -w /workspace \
          -e CONAN_NON_INTERACTIVE=1 \
          -e CONAN_HOME=/tmp/conan-home \
          baresip-linux-conan:latest \
          bash -c "
            echo '🔧 Setting up Conan remotes with internal cache...'
            mkdir -p /tmp/conan-home
            conan profile detect --force
            
            # Add test-conan remote with index 0 (highest priority)
            conan remote add test-conan http://13.61.152.119:9300 --index 0 --force
            conan remote list
            
            # Login to test-conan (check if secrets are available)
            if [[ -n '${{ secrets.CONAN_USER }}' && -n '${{ secrets.CONAN_PASSWORD }}' ]]; then
              echo '🔐 Logging in to test-conan...'
              echo '${{ secrets.CONAN_PASSWORD }}' | conan remote login test-conan '${{ secrets.CONAN_USER }}'
            else
              echo '⚠️  CONAN_USER or CONAN_PASSWORD secrets not found'
              echo '💡 Repository admin needs to add these secrets for artifactory access'
              echo '📦 Will try to continue with public packages only...'
            fi
            
            # Install bbconanconfig (might fail if not authenticated)
            conan config install-pkg bbconanconfig/0.9.5 || echo '⚠️ Could not install bbconanconfig - missing authentication?'
          "

    - name: Build with Conan in Docker
      run: |
        echo "🔨 Building baresip with profile: ${{ matrix.profile }}"
        echo "📋 Configuration: ${{ matrix.config.preset }}"
        
        # Run build in Docker container with internal cache
        docker run --rm --platform linux/amd64 \
          -v "$(pwd)":/workspace \
          -w /workspace \
          -e CONAN_NON_INTERACTIVE=1 \
          -e CONAN_HOME=/tmp/conan-home \
          -e GITHUB_EVENT_NAME="${{ github.event_name }}" \
          -e GITHUB_REF_NAME="${{ github.ref_name }}" \
          -e GITHUB_REF="${{ github.ref }}" \
          baresip-linux-conan:latest \
          bash -c "
            # Always use the specific profile (no fallback to default)
            echo '✅ Using profile: ${{ matrix.profile }}'
            
            # The version is now dynamically generated in conanfile.py
            conan create . \
              -pr:h ${{ matrix.profile }} \
              -pr:b ${{ matrix.profile }} \
              ${{ matrix.config.opts }} \
              --build=missing
          "
          
    - name: Upload packages to artifactory
      if: success()
      run: |
        echo "📤 Uploading built packages to test-conan remote..."
        
        # Run upload in Docker container with internal cache
        docker run --rm --platform linux/amd64 \
          -v "$(pwd)":/workspace \
          -w /workspace \
          -e CONAN_NON_INTERACTIVE=1 \
          -e CONAN_HOME=/tmp/conan-home \
          baresip-linux-conan:latest \
          bash -c "
            # Check if we're authenticated to test-conan
            if conan remote auth test-conan >/dev/null 2>&1; then
              echo '✅ Authenticated to test-conan, uploading packages...'
              
              # Upload baresip package (get version from conan cache)
              BARESIP_VERSION=\$(conan list 'baresip/*' --cache --format=compact | grep 'baresip/' | cut -d'/' -f2 | head -1)
              echo '📦 Uploading baresip version: \${BARESIP_VERSION}'
              conan upload \"baresip/\${BARESIP_VERSION}\" -r=test-conan --confirm
              
              # Upload any other packages that might have been built
              conan list '*' --cache | grep -E '^[a-zA-Z]' | while read package; do
                if [[ \"\$package\" != \"baresip\"* ]]; then
                  echo '📦 Checking if \$package was built and needs upload...'
                  conan upload \"\$package\" -r=test-conan --confirm || true
                fi
              done
            else
              echo '⚠️  Not authenticated to test-conan remote'
              echo '💡 Skipping upload - packages built successfully but not uploaded'
              echo '🔐 Repository admin needs to add CONAN_USER and CONAN_PASSWORD secrets'
            fi
          "
        
    - name: ✅ Build completed successfully  
      run: |
        echo "✅ Build and upload completed successfully!"
        # Get version from Docker container internal cache
        BARESIP_VERSION=$(docker run --rm --platform linux/amd64 \
          -e CONAN_HOME=/tmp/conan-home \
          baresip-linux-conan:latest \
          bash -c "conan list 'baresip/*' --cache --format=compact | grep 'baresip/' | cut -d'/' -f2 | head -1" || echo "unknown")
        echo "📦 Built and uploaded baresip version: ${BARESIP_VERSION}"
