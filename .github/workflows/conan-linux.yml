name: Conan Linux Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Check if this is a Conan integration (skip if not)
  check-conan:
    runs-on: ubuntu-latest
    outputs:
      skip-legacy: ${{ steps.check.outputs.skip-legacy }}
    steps:
    - uses: actions/checkout@v4
    - id: check
      run: |
        if [[ -f "conanfile.py" ]]; then
          echo "skip-legacy=false" >> $GITHUB_OUTPUT
          echo "🚀 Conan integration detected"
        else
          echo "skip-legacy=true" >> $GITHUB_OUTPUT
          echo "📦 No conanfile.py found, skipping Conan workflow"
        fi

  linux-build:
    needs: check-conan
    if: needs.check-conan.outputs.skip-legacy == 'false'
    runs-on: ubuntu-24.04
    
    strategy:
      matrix:
        profile: 
          - bb_linux_ubuntu_24_10_x86_64_release_clang_19
        config:
          - { preset: "default", opts: "-o 'baresip/*:with_sdl=False' -o 'baresip/*:with_gstreamer=False' -o 'baresip/*:with_gtk=False' -o 'baresip/*:with_pipewire=False' -o 'baresip/*:with_sndfile=False' -o 'baresip/*:with_av1=False' -o 'baresip/*:with_ffmpeg=False' -o 'baresip/*:with_vpx=False' -o 'baresip/*:with_pulseaudio=False' -o 'baresip/*:with_mpg123=False'" }

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        echo "🐳 Building Docker image with all dependencies..."
        DOCKER_BUILDKIT=1 docker build --platform linux/amd64 -f docker/linux-conan.Dockerfile -t baresip-linux-conan:latest .

    - name: Build with Conan in Docker
      run: |
        echo "🔨 Building baresip with profile: ${{ matrix.profile }}"
        echo "📋 Configuration: ${{ matrix.config.preset }}"
        
        # Run build in Docker container with internal cache (exactly like successful local build)
        docker run --rm --platform linux/amd64 \
          -v "$(pwd)":/workspace \
          -w /workspace \
          -e CONAN_NON_INTERACTIVE=1 \
          -e CONAN_HOME=/tmp/conan-home \
          -e GITHUB_EVENT_NAME="${{ github.event_name }}" \
          -e GITHUB_REF_NAME="${{ github.ref_name }}" \
          -e GITHUB_REF="${{ github.ref }}" \
          baresip-linux-conan:latest \
          bash -c "
            echo '🔧 Setting up with correct clang-18 profile...'
            conan profile detect --force
            conan remote add test-conan http://13.61.152.119:9300 --index 0 --force
            echo 'secure123' | conan remote login test-conan builder
            conan config install-pkg bbconanconfig/0.9.6
            
            echo '🏗️ Building minimal baresip with all missing dependencies...'
            echo '📺 Using exact same configuration as successful local build!'
            conan create . \
              ${{ matrix.config.opts }} \
              --build=missing
          "
          
    - name: Upload packages to artifactory
      if: success()
      run: |
        echo "📤 Uploading built packages to test-conan remote..."
        
        # Run upload in Docker container with internal cache (same as successful local build)
        docker run --rm --platform linux/amd64 \
          -v "$(pwd)":/workspace \
          -w /workspace \
          -e CONAN_NON_INTERACTIVE=1 \
          -e CONAN_HOME=/tmp/conan-home \
          baresip-linux-conan:latest \
          bash -c "
            echo '🔧 Setting up...'
            conan profile detect --force
            conan remote add test-conan http://13.61.152.119:9300 --index 0 --force
            echo 'secure123' | conan remote login test-conan builder
            
            echo '📦 Listing all packages to upload:'
            conan list '*' --cache
            
            echo '📤 Uploading packages to artifactory...'
            conan upload '*' -r=test-conan --confirm || echo '⚠️ Some packages may already exist'
            
            echo '✅ Upload completed!'
          "
        
    - name: ✅ Build completed successfully  
      run: |
        echo "✅ Build and upload completed successfully!"
        echo "🎯 Used exact same configuration as successful local Docker build"
        echo "📦 Built minimal baresip with audio support (alsa + opus)"
