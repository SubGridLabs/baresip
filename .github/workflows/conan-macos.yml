name: Conan macOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Check if this is a Conan integration (skip if not)
  check-conan:
    runs-on: ubuntu-latest
    outputs:
      skip-legacy: ${{ steps.check.outputs.skip-legacy }}
    steps:
    - uses: actions/checkout@v4
    - id: check
      run: |
        if [[ -f "conanfile.py" ]]; then
          echo "skip-legacy=false" >> $GITHUB_OUTPUT
          echo "🚀 Conan integration detected"
        else
          echo "skip-legacy=true" >> $GITHUB_OUTPUT
          echo "📦 No conanfile.py found, skipping Conan workflow"
        fi

  macos-build:
    needs: check-conan
    if: needs.check-conan.outputs.skip-legacy == 'false'
    runs-on: macos-14
    outputs:
      baresip-version: ${{ steps.get-version.outputs.version }}
      baresip-package-ref: ${{ steps.get-version.outputs.package-ref }}
    
    strategy:
      matrix:
        profile: 
          - bb_macos_15_5_armv8_release_apple-clang_17_0
        config:
          - { preset: "tests", opts: "-o 'baresip/*:with_tests=True' -o 'baresip/*:with_sdl=False' -o 'baresip/*:with_pipewire=False' -o 'baresip/*:with_gstreamer=False' -o 'baresip/*:with_gtk=False' -o 'baresip/*:with_sndfile=False' -o 'baresip/*:with_av1=False' -o 'baresip/*:with_ffmpeg=False' -o 'baresip/*:with_vpx=False' -o 'baresip/*:with_pulseaudio=False' -o 'baresip/*:with_mpg123=False'" }

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Conan
      run: |
        python -m pip install --upgrade pip
        pip install "conan>=2.0"
        
    - name: Install test tools
      if: matrix.config.preset == 'tests'
      run: |
        pip install gcovr==5.0
        echo "Test tools installed for test build"

    - name: Setup Conan
      run: |
        # Set consistent CONAN_HOME for build job
        export CONAN_HOME=/tmp/conan-home-build
        mkdir -p $CONAN_HOME
        echo "CONAN_HOME=$CONAN_HOME" >> $GITHUB_ENV
        
        conan profile detect --force
        
        # Add test-conan remote with higher priority (index 0)
        conan remote add test-conan http://13.61.152.119:9300 --index 0 --force
        conan remote list
        
        # Login to test-conan (check if secrets are available)
        if [[ -n "${{ secrets.CONAN_USER }}" && -n "${{ secrets.CONAN_PASSWORD }}" ]]; then
          echo "🔐 Logging in to test-conan..."
          echo "${{ secrets.CONAN_PASSWORD }}" | conan remote login test-conan "${{ secrets.CONAN_USER }}"
        else
          echo "⚠️  CONAN_USER or CONAN_PASSWORD secrets not found"
          echo "💡 Repository admin needs to add these secrets for artifactory access"
          echo "📦 Will try to continue with public packages only..."
        fi
        
        # Install bbconanconfig (MUST succeed after login)
        echo "🔧 Installing bbconanconfig from test-conan..."
        if conan config install-pkg bbconanconfig/0.9.5; then
          echo "✅ bbconanconfig installed successfully"
          echo "📋 Available profiles:"
          conan profile list
        else
          echo "❌ Failed to install bbconanconfig"
          echo "🔍 Checking if bbconanconfig package exists on test-conan..."
          conan list "bbconanconfig/*" -r=test-conan || echo "bbconanconfig not found on test-conan"
          echo "💥 Cannot proceed without proper profiles - this will cause build failures"
          exit 1
        fi
        
    - name: Build with Conan
      run: |
        echo "🔨 Building baresip with profile: ${{ matrix.profile }}"
        echo "📋 Configuration: ${{ matrix.config.preset }}"
        
        # Check if the profile exists, fallback to default if not
        if conan profile show ${{ matrix.profile }} >/dev/null 2>&1; then
          echo "✅ Using profile: ${{ matrix.profile }}"
          PROFILE_ARG="-pr:h ${{ matrix.profile }} -pr:b ${{ matrix.profile }}"
        else
          echo "⚠️  Profile ${{ matrix.profile }} not found, using default"
          PROFILE_ARG=""
        fi
        
        # Split conan create into steps to capture built dependencies
        echo "📥 Step 1: Installing dependencies with --build=missing..."
        conan install . \
          $PROFILE_ARG \
          ${{ matrix.config.opts }} \
          --build=missing \
          | tee install_output.log
        
        # Extract built packages from install output
        echo "🔍 Extracting built packages from install log..."
        grep "Package '.*' created" install_output.log | sed "s/.*Package '\\(.*\\)' created.*/\\1/" | sort | uniq > built_packages.txt || echo "No packages were built" > built_packages.txt
        echo "📋 Built packages:"
        cat built_packages.txt
        
        echo "🔨 Step 2: Building baresip..."
        conan build . \
          $PROFILE_ARG \
          ${{ matrix.config.opts }}
        
        echo "📦 Step 3: Creating baresip package..."
        conan export-pkg . \
          $PROFILE_ARG \
          ${{ matrix.config.opts }}
          
    - name: Upload packages to artifactory
      if: success()
      run: |
        echo "📤 Uploading built packages to test-conan remote..."
        
        # Check if we're authenticated to test-conan
        if conan remote auth test-conan >/dev/null 2>&1; then
          echo "✅ Authenticated to test-conan, uploading packages..."
          
          # Get baresip version
          BARESIP_VERSION=$(conan list "baresip/*" --cache --format=compact 2>/dev/null | grep "baresip/" | cut -d'/' -f2 | head -1)
          if [[ -z "$BARESIP_VERSION" ]]; then
            echo "❌ Failed to get baresip version from cache"
            exit 1
          fi
          echo "📦 Found baresip version: ${BARESIP_VERSION}"
          
          # Add baresip to the built packages list
          echo "baresip/${BARESIP_VERSION}" >> built_packages.txt
          
          echo "📋 All packages to upload:"
          cat built_packages.txt
          
          # Upload baresip first (with metadata for test builds)
          if [[ "${{ matrix.config.preset }}" == "tests" ]]; then
            echo "🧪 Uploading baresip package with test binaries metadata..."
            if ! conan upload "baresip/${BARESIP_VERSION}" -r=test-conan --confirm --metadata="*" 2>/dev/null; then
              echo "❌ Failed to upload baresip package with metadata"
              exit 1
            fi
          else
            echo "📦 Uploading baresip package..."
            if ! conan upload "baresip/${BARESIP_VERSION}" -r=test-conan --confirm 2>/dev/null; then
              echo "❌ Failed to upload baresip package"
              exit 1
            fi
          fi
          
          # Upload other built dependencies
          while read package_ref; do
            # Skip empty lines and baresip (already uploaded with metadata)
            if [[ -n "$package_ref" ]] && [[ "$package_ref" != "baresip/"* ]] && [[ "$package_ref" != "No packages were built" ]]; then
              echo "📦 Uploading dependency: $package_ref"
              if ! conan upload "$package_ref" -r=test-conan --confirm 2>/dev/null; then
                echo "⚠️ Failed to upload $package_ref (might already exist)"
              else
                echo "✅ Uploaded $package_ref"
              fi
            fi
          done < built_packages.txt
          
          echo "✅ Upload process completed"
        else
          echo "⚠️  Not authenticated to test-conan remote"
          echo "💡 Skipping upload - packages built successfully but not uploaded"
          echo "🔐 Repository admin needs to add CONAN_USER and CONAN_PASSWORD secrets"
        fi
        
    - name: Get baresip package reference  
      id: get-version
      run: |
        # Get the exact package reference with package ID for the test job
        echo "🔍 Getting exact baresip package reference from cache..."
        BARESIP_VERSION=$(conan list "baresip/*" --cache --format=compact 2>/dev/null | grep "baresip/" | cut -d'/' -f2 | head -1)
        if [[ -z "$BARESIP_VERSION" ]]; then
          echo "❌ Failed to get baresip version from cache"
          exit 1
        fi
        
        # Get the package ID for the tests variant (with_tests=True)
        FULL_OUTPUT=$(conan list "baresip/${BARESIP_VERSION}:*" --cache 2>/dev/null || true)
        PACKAGE_ID=$(echo "$FULL_OUTPUT" | grep -A 20 "with_tests: True" | grep -E '^[[:space:]]*[a-f0-9]{40}[[:space:]]*$' | tr -d ' ' | head -1)
        
        if [[ -z "$PACKAGE_ID" ]]; then
          echo "❌ Failed to get package ID for test variant"
          echo "📋 Available packages:"
          echo "$FULL_OUTPUT"
          exit 1
        fi
        
        FULL_PACKAGE_REF="baresip/${BARESIP_VERSION}:${PACKAGE_ID}"
        echo "version=${BARESIP_VERSION}" >> $GITHUB_OUTPUT
        echo "package-ref=${FULL_PACKAGE_REF}" >> $GITHUB_OUTPUT
        echo "📦 Built baresip version: ${BARESIP_VERSION}"
        echo "📦 Full package reference: ${FULL_PACKAGE_REF}"
        
    - name: ✅ Build completed successfully
      run: |
        echo "✅ Build and upload completed successfully!"
        echo "📦 Built and uploaded baresip version: ${{ steps.get-version.outputs.version }}"
        
        if [[ "${{ matrix.config.preset }}" == "tests" ]]; then
          echo "🧪 Test binaries saved to package metadata - ready for separate test/coverage stage"
        fi

  # Stage 2: Test macOS package (separate job/stage)  
  test-macos-package:
    needs: [check-conan, macos-build]
    if: needs.check-conan.outputs.skip-legacy == 'false'
    runs-on: macos-14

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Conan
      run: |
        python -m pip install --upgrade pip
        pip install "conan>=2.0"

    - name: Setup Conan
      run: |
        # Set consistent CONAN_HOME for test job
        export CONAN_HOME=/tmp/conan-home-test
        mkdir -p $CONAN_HOME
        echo "CONAN_HOME=$CONAN_HOME" >> $GITHUB_ENV
        
        conan profile detect --force
        
        # Add test-conan remote with higher priority (index 0)
        conan remote add test-conan http://13.61.152.119:9300 --index 0 --force
        conan remote list
        
        # Login to test-conan (check if secrets are available)
        if [[ -n "${{ secrets.CONAN_USER }}" && -n "${{ secrets.CONAN_PASSWORD }}" ]]; then
          echo "🔐 Logging in to test-conan..."
          echo "${{ secrets.CONAN_PASSWORD }}" | conan remote login test-conan "${{ secrets.CONAN_USER }}"
        else
          echo "⚠️  CONAN_USER or CONAN_PASSWORD secrets not found"
          echo "💡 Repository admin needs to add these secrets for artifactory access"
        fi
        
        # Install bbconanconfig to get the exact same profile used in build
        echo "🔧 Installing bbconanconfig from test-conan..."
        if conan config install-pkg bbconanconfig/0.9.5; then
          echo "✅ bbconanconfig installed successfully"
          echo "📋 Available profiles:"
          conan profile list
        else
          echo "❌ Failed to install bbconanconfig"
          echo "🔍 Checking if bbconanconfig package exists on test-conan..."
          conan list "bbconanconfig/*" -r=test-conan || echo "bbconanconfig not found on test-conan"
          echo "💥 Cannot proceed without proper profiles - this will cause package ID mismatches"
          exit 1
        fi
        
        # CRITICAL: Use the same profile as the test build to match package IDs
        echo "🎯 Verifying bb_macos_15_5_armv8_release_apple-clang_17_0 profile is available..."
        echo "📋 Available profiles:"
        conan profile list 2>/dev/null | grep "bb_macos_15_5_armv8_release"
        
        # Try to show the profile details
        echo "🔍 Attempting to show profile details..."
        if conan profile show bb_macos_15_5_armv8_release_apple-clang_17_0 2>&1; then
          echo "✅ Successfully accessed bb_macos profile"
        else
          echo "❌ Failed to show profile details"
          echo "🔍 Let's try a different approach - check if profile exists in list:"
          if conan profile list 2>/dev/null | grep -q "bb_macos_15_5_armv8_release_apple-clang_17_0"; then
            echo "✅ Profile found in list, but 'conan profile show' command failed"
            echo "🔧 This might be due to bbconanconfig stderr errors - continuing anyway"
          else
            echo "❌ Profile not found in list either - CANNOT PROCEED!"
            exit 1
          fi
        fi
        
    - name: Deploy test package using full deployer
      run: |
        echo "📦 Deploying baresip test package using full_deploy deployer..."
        
        # Get the version from the build job
        BARESIP_VERSION="${{ needs.macos-build.outputs.baresip-version }}"
        if [[ -z "$BARESIP_VERSION" ]]; then
          echo "❌ Could not get baresip version from build job"
          exit 1
        fi
        
        echo "📦 Verifying baresip version ${BARESIP_VERSION} exists on remote..."
        
        # First verify the package exists on the remote before downloading
        echo "🔍 Checking if package exists on test-conan remote..."
        if conan list "baresip/${BARESIP_VERSION}" -r=test-conan 2>/dev/null; then
          echo "✅ Package found on remote"
        else
          echo "❌ Package not found on remote - build may have failed or upload incomplete"
          echo "📋 Available packages on remote:"
          conan list "baresip/*" -r=test-conan || echo "No baresip packages found"
          exit 1
        fi
        
        # Use the exact package reference from build job (no profile matching needed!)
        BARESIP_PACKAGE_REF="${{ needs.macos-build.outputs.baresip-package-ref }}"
        echo "🚀 Deploying exact baresip package using direct package reference..."
        echo "📦 Using exact package reference: ${BARESIP_PACKAGE_REF}"
        mkdir -p baresip_test_deploy
        
        # Download the specific package binary directly (no profile needed)
        echo "📥 Downloading specific package binary..."
        conan download "${BARESIP_PACKAGE_REF}" -r=test-conan
        
        # Use conan install with the downloaded package
        conan install --requires="baresip/${BARESIP_VERSION}" \
          --requires-override="${BARESIP_PACKAGE_REF}" \
          -d full_deploy --deployer-folder=baresip_test_deploy
        
        # Download metadata separately to get the selftest binary
        echo "📥 Downloading test metadata (selftest binary)..."
        conan download "baresip/${BARESIP_VERSION}" --metadata="tests/*" -r=test-conan
        
        echo "✅ Deployment complete - checking deployed structure and metadata..."
        echo "📁 Deployed binaries and libraries:"
        find baresip_test_deploy -name "*.dylib" | head -10
        echo "📁 Downloaded test metadata:"
        find ~/.conan2 -name "selftest" -type f 2>/dev/null | head -5
        
    - name: Run tests from deployed package
      run: |
        echo "🧪 Running tests from deployed package..."
        
        # Get the version for reference
        BARESIP_VERSION="${{ needs.macos-build.outputs.baresip-version }}"
        
        # Find the selftest binary from the downloaded metadata
        echo "🔍 Looking for selftest binary in downloaded metadata..."
        TEST_BINARY=$(find ~/.conan2 -name "selftest" -path "*/metadata/tests/selftest" -type f | head -1)
        
        if [[ -z "$TEST_BINARY" ]]; then
          echo "❌ Test binary not found in metadata"
          echo "📁 Available metadata files:"
          find ~/.conan2 -path "*/metadata/tests/*" -type f 2>/dev/null | head -10
          exit 1
        fi
        
        echo "📁 Found test binary: $TEST_BINARY"
        
        # Make the test binary executable
        chmod +x "$TEST_BINARY"
        
        # Find libbaresip.21.dylib in the deployed structure
        echo "🔧 Setting up library paths..."
        BARESIP_DYLIB=$(find baresip_test_deploy -name "libbaresip.21.dylib" -type f | head -1)
        
        if [[ -n "$BARESIP_DYLIB" ]]; then
          BARESIP_LIB_DIR=$(dirname "$BARESIP_DYLIB")
          echo "✅ Found libbaresip.21.dylib at: $BARESIP_DYLIB"
          export DYLD_LIBRARY_PATH="${BARESIP_LIB_DIR}:$DYLD_LIBRARY_PATH"
        else
          echo "❌ libbaresip.21.dylib not found in deployed package"
          echo "📁 Available dylib files:"
          find baresip_test_deploy -name "*.dylib" -type f
          exit 1
        fi
        
        echo "📚 Library paths:"
        echo "DYLD_LIBRARY_PATH: $DYLD_LIBRARY_PATH"
        
        # Run the tests
        echo "🏃 Running baresip tests..."
        TEST_EXIT_CODE=0
        if "$TEST_BINARY" 2>&1 | tee test_output.log; then
          TEST_EXIT_CODE=$?
        else
          TEST_EXIT_CODE=$?
        fi
        
        # Count test results from output (fix the parsing)
        TOTAL_TESTS=$(grep -c "RUN.*test_" test_output.log 2>/dev/null || echo "0")
        PASSED_TESTS=$(grep -c "OK.*]$" test_output.log 2>/dev/null || echo "0")
        # Ensure we have valid numbers
        TOTAL_TESTS=${TOTAL_TESTS//[^0-9]/}
        PASSED_TESTS=${PASSED_TESTS//[^0-9]/}
        TOTAL_TESTS=${TOTAL_TESTS:-0}
        PASSED_TESTS=${PASSED_TESTS:-0}
        FAILED_TESTS=$((TOTAL_TESTS - PASSED_TESTS))
        
        # Determine test status based on results
        if [[ $TOTAL_TESTS -eq 0 ]]; then
          echo "❌ No tests were executed - this is a failure!"
          TEST_STATUS="FAILED"
        elif [[ $FAILED_TESTS -eq 0 && $TEST_EXIT_CODE -eq 0 ]]; then
          echo "✅ All $TOTAL_TESTS tests passed!"
          TEST_STATUS="PASSED"
        elif [[ $FAILED_TESTS -gt 0 ]]; then
          echo "⚠️  $FAILED_TESTS out of $TOTAL_TESTS tests failed"
          TEST_STATUS="PARTIAL_FAILURE"
        else
          echo "⚠️  Tests completed with exit code $TEST_EXIT_CODE"
          TEST_STATUS="PARTIAL_FAILURE"
        fi
        
        # Generate test results summary
        cat > test_results.json << EOF
        {
          "test_status": "$TEST_STATUS",
          "total_tests": $TOTAL_TESTS,
          "passed_tests": $PASSED_TESTS,
          "failed_tests": $FAILED_TESTS,
          "test_run_time": "$(date -Iseconds)",
          "runner_os": "macos-14",
          "runner_arch": "arm64",
          "baresip_version": "$BARESIP_VERSION",
          "test_method": "conan_metadata_download",
          "package_id": "$PACKAGE_ID"
        }
        EOF
        
        echo "📊 Test Results Summary:"
        cat test_results.json
        
    - name: Upload test results and logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: macos-test-results
        path: |
          test_results.json
          test_output.log
        
    - name: ✅ macOS Package Testing Complete
      run: |
        echo "✅ macOS package testing completed!"
        echo "📊 Check artifacts for detailed test results and logs"
        
        # Fail the job if tests failed
        if [[ -f test_results.json ]]; then
          TEST_STATUS=$(grep -o '"test_status":[^,]*' test_results.json | cut -d'"' -f4)
          if [[ "$TEST_STATUS" == "FAILED" ]]; then
            echo "❌ Tests failed - failing the CI job"
            exit 1
          elif [[ "$TEST_STATUS" == "PARTIAL_FAILURE" ]]; then
            echo "⚠️ Some tests failed - failing the CI job"
            exit 1
          fi
        fi
