name: Conan macOS Build

on:
  push:
    branches: [ main, conan-integration ]
  pull_request:
    branches: [ main ]

jobs:
  # Check if this is a Conan integration (skip if not)
  check-conan:
    runs-on: ubuntu-latest
    outputs:
      skip-legacy: ${{ steps.check.outputs.skip-legacy }}
    steps:
    - uses: actions/checkout@v4
    - id: check
      run: |
        if [[ -f "conanfile.py" ]]; then
          echo "skip-legacy=false" >> $GITHUB_OUTPUT
          echo "🚀 Conan integration detected"
        else
          echo "skip-legacy=true" >> $GITHUB_OUTPUT
          echo "📦 No conanfile.py found, skipping Conan workflow"
        fi

  macos-build:
    needs: check-conan
    if: needs.check-conan.outputs.skip-legacy == 'false'
    runs-on: macos-14
    outputs:
      baresip-version: ${{ steps.get-version.outputs.version }}
    
    strategy:
      matrix:
        profile: 
          - bb_macos_15_5_armv8_release_apple-clang_17_0
        config:
          - { preset: "default", opts: "-o 'baresip/*:with_sdl=True' -o 'baresip/*:with_pipewire=True' -o 'baresip/*:with_gstreamer=False' -o 'baresip/*:with_gtk=False' -o 'baresip/*:with_sndfile=False' -o 'baresip/*:with_av1=False' -o 'baresip/*:with_ffmpeg=False' -o 'baresip/*:with_vpx=False' -o 'baresip/*:with_pulseaudio=False' -o 'baresip/*:with_mpg123=False'" }
          - { preset: "tests", opts: "-o 'baresip/*:with_tests=True' -o 'baresip/*:with_sdl=False' -o 'baresip/*:with_pipewire=False' -o 'baresip/*:with_gstreamer=False' -o 'baresip/*:with_gtk=False' -o 'baresip/*:with_sndfile=False' -o 'baresip/*:with_av1=False' -o 'baresip/*:with_ffmpeg=False' -o 'baresip/*:with_vpx=False' -o 'baresip/*:with_pulseaudio=False' -o 'baresip/*:with_mpg123=False'" }

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Conan
      run: |
        python -m pip install --upgrade pip
        pip install "conan>=2.0"
        
    - name: Install test tools
      if: matrix.config.preset == 'tests'
      run: |
        pip install gcovr==5.0
        echo "Test tools installed for test build"

    - name: Setup Conan
      run: |
        conan profile detect --force
        
        # Add test-conan remote with higher priority
        conan remote add test-conan http://13.61.152.119:9300 --force
        conan remote list
        
        # Login to test-conan (check if secrets are available)
        if [[ -n "${{ secrets.CONAN_USER }}" && -n "${{ secrets.CONAN_PASSWORD }}" ]]; then
          echo "🔐 Logging in to test-conan..."
          echo "${{ secrets.CONAN_PASSWORD }}" | conan remote login test-conan ${{ secrets.CONAN_USER }}
        else
          echo "⚠️  CONAN_USER or CONAN_PASSWORD secrets not found"
          echo "💡 Repository admin needs to add these secrets for artifactory access"
          echo "📦 Will try to continue with public packages only..."
        fi
        
        # Install bbconanconfig (might fail if not authenticated)
        conan config install-pkg bbconanconfig/0.9.5 || echo "⚠️ Could not install bbconanconfig - missing authentication?"
        
    - name: Build with Conan
      run: |
        echo "🔨 Building baresip with profile: ${{ matrix.profile }}"
        echo "📋 Configuration: ${{ matrix.config.preset }}"
        
        # Check if the profile exists, fallback to default if not
        if conan profile show ${{ matrix.profile }} >/dev/null 2>&1; then
          echo "✅ Using profile: ${{ matrix.profile }}"
          PROFILE_ARG="-pr:h ${{ matrix.profile }} -pr:b ${{ matrix.profile }}"
        else
          echo "⚠️  Profile ${{ matrix.profile }} not found, using default"
          PROFILE_ARG=""
        fi
        
        # The version is now dynamically generated in conanfile.py
        conan create . \
          $PROFILE_ARG \
          ${{ matrix.config.opts }} \
          --build=missing
          
    - name: Upload packages to artifactory
      if: success()
      run: |
        echo "📤 Uploading built packages to test-conan remote..."
        
        # Check if we're authenticated to test-conan
        if conan remote auth test-conan >/dev/null 2>&1; then
          echo "✅ Authenticated to test-conan, uploading packages..."
          
          # Upload baresip package (get version from conan cache)
          BARESIP_VERSION=$(conan list "baresip/*" --cache --format=compact | grep "baresip/" | cut -d'/' -f2 | head -1)
          echo "📦 Uploading baresip version: ${BARESIP_VERSION}"
          
          # Upload package with metadata for test builds
          if [[ "${{ matrix.config.preset }}" == "tests" ]]; then
            echo "🧪 Uploading package with test binaries metadata..."
            conan upload "baresip/${BARESIP_VERSION}" -r=test-conan --confirm --metadata="*"
          else
            conan upload "baresip/${BARESIP_VERSION}" -r=test-conan --confirm
          fi
          
          # Upload any other packages that might have been built
          conan list "*" --cache | grep -E "^[a-zA-Z]" | while read package; do
            if [[ "$package" != "baresip"* ]]; then
              echo "📦 Checking if $package was built and needs upload..."
              conan upload "$package" -r=test-conan --confirm || true
            fi
          done
        else
          echo "⚠️  Not authenticated to test-conan remote"
          echo "💡 Skipping upload - packages built successfully but not uploaded"
          echo "🔐 Repository admin needs to add CONAN_USER and CONAN_PASSWORD secrets"
        fi
        
    - name: Get baresip version
      id: get-version
      run: |
        BARESIP_VERSION=$(conan list "baresip/*" --cache --format=compact | grep "baresip/" | cut -d'/' -f2 | head -1)
        echo "version=${BARESIP_VERSION}" >> $GITHUB_OUTPUT
        echo "📦 Built baresip version: ${BARESIP_VERSION}"
        
    - name: ✅ Build completed successfully
      run: |
        echo "✅ Build and upload completed successfully!"
        echo "📦 Built and uploaded baresip version: ${{ steps.get-version.outputs.version }}"
        
        if [[ "${{ matrix.config.preset }}" == "tests" ]]; then
          echo "🧪 Test binaries saved to package metadata - ready for separate test/coverage stage"
        fi

  # Stage 2: Test macOS package (separate job/stage)
  test-macos-package:
    needs: [check-conan, macos-build]
    if: needs.check-conan.outputs.skip-legacy == 'false'
    runs-on: macos-14

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Conan
      run: |
        python -m pip install --upgrade pip
        pip install "conan>=2.0"

    - name: Setup Conan
      run: |
        conan profile detect --force
        
        # Add test-conan remote with higher priority
        conan remote add test-conan http://13.61.152.119:9300 --force
        conan remote list
        
        # Login to test-conan (check if secrets are available)
        if [[ -n "${{ secrets.CONAN_USER }}" && -n "${{ secrets.CONAN_PASSWORD }}" ]]; then
          echo "🔐 Logging in to test-conan..."
          echo "${{ secrets.CONAN_PASSWORD }}" | conan remote login test-conan "${{ secrets.CONAN_USER }}"
        else
          echo "⚠️  CONAN_USER or CONAN_PASSWORD secrets not found"
          echo "💡 Repository admin needs to add these secrets for artifactory access"
        fi
        
        # Install bbconanconfig (might fail if not authenticated)
        conan config install-pkg bbconanconfig/0.9.5 || echo "⚠️ Could not install bbconanconfig - missing authentication?"
        
    - name: Download test binaries using proper metadata approach
      run: |
        echo "📥 Downloading baresip package with test binaries using proper Conan metadata..."
        
        # Get the version from the build job
        BARESIP_VERSION="${{ needs.macos-build.outputs.baresip-version }}"
        if [[ -z "$BARESIP_VERSION" ]]; then
          echo "❌ Could not get baresip version from build job"
          exit 1
        fi
        
        echo "📦 Downloading metadata for baresip version: ${BARESIP_VERSION}"
        
        # Use proper conan download with metadata (following Conan guidelines)
        conan download "baresip/${BARESIP_VERSION}" --metadata="tests/*" -r=test-conan
        
    - name: Run tests from downloaded metadata
      run: |
        echo "🧪 Running tests from downloaded metadata..."
        
        # Get the metadata path using conan cache path command
        BARESIP_VERSION="${{ needs.macos-build.outputs.baresip-version }}"
        
        # Find the package ID for the test build (with_tests=True)
        echo "Looking for package with tests enabled..."
        conan list "baresip/${BARESIP_VERSION}:*" --cache
        
        # We need to find the package ID that has with_tests=True
        # Unfortunately, conan list doesn't filter by options, so we'll try both package IDs
        ALL_PACKAGE_IDS=$(conan list "baresip/${BARESIP_VERSION}:*" --cache --format=compact | grep "baresip/${BARESIP_VERSION}:" | cut -d':' -f2)
        
        PACKAGE_ID=""
        for pkg_id in $ALL_PACKAGE_IDS; do
          echo "🔍 Checking package ID: $pkg_id"
          # Check if this package has test metadata
          METADATA_PATH_TEST=$(conan cache path "baresip/${BARESIP_VERSION}:${pkg_id}" --folder=metadata)
          if [[ -f "${METADATA_PATH_TEST}/tests/selftest" ]]; then
            echo "✅ Found package with test binaries: $pkg_id"
            PACKAGE_ID="$pkg_id"
            break
          else
            echo "❌ Package $pkg_id does not have test binaries"
          fi
        done
        
        if [[ -z "$PACKAGE_ID" ]]; then
          echo "❌ Could not find package ID for baresip/${BARESIP_VERSION}"
          exit 1
        fi
        
        # Get the metadata folder path
        METADATA_PATH=$(conan cache path "baresip/${BARESIP_VERSION}:${PACKAGE_ID}" --folder=metadata)
        TEST_BINARY="${METADATA_PATH}/tests/selftest"
        
        if [[ ! -f "$TEST_BINARY" ]]; then
          echo "❌ Test binary not found at: $TEST_BINARY"
          exit 1
        fi
        
        echo "📁 Found test binary: $TEST_BINARY"
        
        # Display test info
        if [[ -f "${METADATA_PATH}/tests/test_info.json" ]]; then
          echo "📋 Test build information:"
          cat "${METADATA_PATH}/tests/test_info.json"
        fi
        
        # Make executable and run tests
        chmod +x "$TEST_BINARY"
        
        echo "🏃 Running baresip tests..."
        if "$TEST_BINARY" 2>&1 | tee test_output.log; then
          echo "✅ Tests completed successfully!"
          TEST_STATUS="PASSED"
        else
          echo "⚠️  Some tests failed (exit code $?)"
          TEST_STATUS="PARTIAL_FAILURE"
        fi
        
        # Count test results from output
        TOTAL_TESTS=$(grep -c "RUN.*test_" test_output.log || echo "0")
        PASSED_TESTS=$(grep -c "OK.*]$" test_output.log || echo "0")
        FAILED_TESTS=$((TOTAL_TESTS - PASSED_TESTS))
        
        # Generate test results summary
        cat > test_results.json << EOF
        {
          "test_status": "$TEST_STATUS",
          "total_tests": $TOTAL_TESTS,
          "passed_tests": $PASSED_TESTS,
          "failed_tests": $FAILED_TESTS,
          "test_run_time": "$(date -Iseconds)",
          "runner_os": "macos-14",
          "runner_arch": "arm64",
          "baresip_version": "$BARESIP_VERSION",
          "test_method": "conan_metadata_download",
          "package_id": "$PACKAGE_ID"
        }
        EOF
        
        echo "📊 Test Results Summary:"
        cat test_results.json
        
    - name: Upload test results and logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: macos-test-results
        path: |
          test_results.json
          test_output.log
        
    - name: ✅ macOS Package Testing Complete
      run: |
        echo "✅ macOS package testing completed!"
        echo "📊 Check artifacts for detailed test results and logs"
