name: OpenSSL no-deprecated and LibreSSL

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:
  # Check if this is a Conan integration (skip legacy build if so)
  check-conan:
    runs-on: ubuntu-latest
    outputs:
      skip-legacy: ${{ steps.check.outputs.skip-legacy }}
    steps:
    - uses: actions/checkout@v4
    - id: check
      run: |
        if [[ -f "conanfile.py" ]]; then
          echo "skip-legacy=true" >> $GITHUB_OUTPUT
          echo "🚀 Conan integration detected - skipping SSL tests"
        else
          echo "skip-legacy=false" >> $GITHUB_OUTPUT
          echo "📦 No Conan integration - running SSL tests"
        fi

  ssl:
    runs-on: ubuntu-latest 
    needs: check-conan
    if: needs.check-conan.outputs.skip-legacy != 'true'

    strategy:
      matrix:
        ssl: [libressl, openssl]

    steps:
    - uses: actions/checkout@v5

    - uses: sreimers/pr-dependency-action@v1
      with:
        name: re
        repo: https://github.com/baresip/re
        secret: ${{ secrets.GITHUB_TOKEN }}

    - name: make re
      run: |
        for p in re; do
          cmake -S $p -B $p/build
          cmake --build $p/build -j
        done
        for p in re; do
          mv $p ../.
        done
        sudo ldconfig

    - name: make baresip
      run: cmake -B build -DCMAKE_C_FLAGS="-Iassets/${{ matrix.ssl }}/include -Werror" -DCMAKE_EXE_LINKER_FLAGS="-Lassets/${{ matrix.ssl }}" && cmake --build build -j
